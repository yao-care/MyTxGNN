# Malaysia TxGNN Drug Repurposing Reports
# Jekyll configuration for GitHub Pages

# Basic settings
title: "Laporan Penggunaan Semula Ubat MyTxGNN"
description: "Ramalan penggunaan semula ubat Malaysia menggunakan model TxGNN (pembelajaran mendalam)"

url: "https://mytxgnn.yao.care"
baseurl: ""
lang: "ms"

# Jekyll theme
remote_theme: just-the-docs/just-the-docs

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Search functionality
search_enabled: true
search:
  heading_level: 3

# Footer
footer_content: "Hak Cipta &copy; 2026 藥提醒科技有限公司 (yao.care). Untuk tujuan penyelidikan sahaja. Bukan nasihat perubatan."

# Auxiliary navigation links
aux_links:
  "GitHub":
    - "https://github.com/yao-care/MyTxGNN"

# RSS Feed
feed:
  path: feed.xml
  posts_limit: 20

# Collections
collections:
  drugs:
    output: true
    permalink: /drugs/:name/

# Default values
defaults:
  # 2026-10-16：演示頁不進 sitemap
  - scope:
      path: "cds-hooks/demo.html"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "drugs"
    values:
      layout: "drug"
  # 2026-11-03：SMART 啟動端點與應用殼（需從 EHR 啟動、沒有可收錄內容）不列入 sitemap；
  # 兩頁本身也有 <meta name="robots" content="noindex">。獨立測試頁 standalone.html 原本照常收錄，
  # 同日用戶決定也改成不收錄、不列入 sitemap（頁面照常可用，只是不進搜尋索引）。
  - scope:
      path: "smart/launch.html"
    values:
      sitemap: false
  - scope:
      path: "smart/app.html"
    values:
      sitemap: false
  - scope:
      path: "smart/standalone.html"
    values:
      sitemap: false

# Open Graph settings
og_image: "/assets/images/og-default.png"

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.template"


