# 臨時測試（2026-10-31）：GitHub runner 能否連上 NPRA QUEST3+ 產品查詢（確認 324 張許可證狀態用），測完即刪
name: Probe NPRA
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          curl -sS -m 90 -A 'Mozilla/5.0 Chrome/120' -o p.html -w 'GET %{http_code} %{time_total}\n' https://quest3plus.bpfk.gov.my/pmo2/index.php || true
          grep -io '<form[^>]*>\|<input[^>]*>\|<select[^>]*>' p.html | head -30 || true
